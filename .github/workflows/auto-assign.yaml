name: Issue assignment

on:
  issues:
    types: [opened]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 'Auto-assign issue'
        uses: pozil/auto-assign-issue@v4.0.1
        with:
          assignees: sarvsav
          allowSelfAssign: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}
